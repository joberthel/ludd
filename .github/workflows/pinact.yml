name: Pinact

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    name: Verify Action Pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pinact check
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: 'false'
